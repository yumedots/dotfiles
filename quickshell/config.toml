[colors]
surface = "#101010"
surfaceTranslucent = "#ff101010"  # "#" + ("0" + Math.round(surfaceAlpha * 255).toString(16)).slice(-2) + surface.slice(1)
foreground = "#ffffff"
dim = "#3f3f3f"
red = "#e05252"
muted = "#5c5c5c"
mono = true

# things that are not a widget: font, spacing, workspace morph
[shell]
workspaceSpacing = 6
workspaceMorphMs = 320
figureLobes = 9
figureScallop = 0.16
fontFamily = "GoogleSansCode Nerd Font"
fontSize = 12
valueSample = "0123456789.%G"
iconSize = 10
spacing = 12
lineLength = 45
scrollbarWidth = 2
gapsIn = 4
gapsOut = 8

# tray icons and their menu
[tray]
trayIconSize = 15
trayIconGap = 10
trayGroupSize = 15
trayChevronBoost = 1
trayMenuWidth = 120
trayMenuPadding = 6
trayMenuRowHeight = 18
trayMenuSeparator = 1

# the bar itself, its cells and the sweep that runs through them
[bar]
barHitPadding = 4
barStatSpacing = 16
barCells = 15
barInset = 8
barPadding = 8
barFloating = false
barBorderWidth = 0  # barFloating ? -1 : 0
barStatMode = "icon"
barStatMono = true
barThickness = 1.5
barSweepMs = 1400
sweepFade = 0.45
sweepSteps = 5
clockFormat = "ddd MMM d h:mm AP"
borderFallbackWidth = 1
borderFallbackColor = "#ffffff"

# every panel's fade, slide and position
[popup]
popupCloseDelay = 60
popupFadeMs = 140
popupSlideMs = 400
barFadeMs = 300
popupPos = "top-center"
popupX = -1
popupY = -1
